name: Deploy Atlas to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'atlas/**'
      - '.github/workflows/deploy-atlas.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'atlas/**'
      - '.github/workflows/deploy-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'atlas/package-lock.json'

      - name: Install atlas dependencies
        working-directory: atlas
        run: npm ci

      - name: Run contract tests
        working-directory: atlas
        run: npm test

      - name: Build atlas documentation
        working-directory: atlas
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: atlas/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
