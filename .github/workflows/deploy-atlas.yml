name: Deploy Atlas to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'atlas/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'atlas/package-lock.json'

      - name: Install atlas dependencies
        working-directory: atlas
        run: npm ci

      - name: Run contract tests
        working-directory: atlas
        run: node --test build-contract.test.mjs

      - name: Build atlas documentation
        working-directory: atlas
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: atlas/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
